<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="RelayOps turns scattered engineering activity into a traceable, human-verified handover when team members depart."
    />
    <meta property="og:title" content="RelayOps — Traceable, Human-Verified Handover Intelligence" />
    <meta
      property="og:description"
      content="Converts git commits, PRs, Jira tickets, Slack logs, and ADRs into a verifiable, dual-signed handover with cryptographic audit ledgers."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RelayOps — Traceable, Human-Verified Handover Intelligence" />
    <meta
      name="twitter:description"
      content="Converts scattered engineering activity into a verifiable, dual-signed handover."
    />
    <title>RelayOps — Traceable, Human-Verified Handover Intelligence</title>
    <script>
      // Set the theme before first paint so a dark-mode user never sees a white flash.
      (function () {
        try {
          var stored = localStorage.getItem("relayops-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle(
            "dark",
            stored ? stored === "dark" : prefersDark,
          );
        } catch (error) {
          /* localStorage can be blocked; light theme is the safe default. */
        }
      })();
    </script>
    <style>
      /* Fallback loading splash displayed before React boots */
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0b1120;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .splash-logo {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: #4f46e5;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      }
      .splash-spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(255, 255, 255, 0.2);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      .splash-text {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #e2e8f0;
      }
      .splash-sub {
        font-size: 11px;
        color: #64748b;
        margin-top: 4px;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-logo">
        <div class="splash-spinner"></div>
      </div>
      <div class="splash-text">RelayOps Handover Engine</div>
      <div class="splash-sub">Initializing verified workspace...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
